# Конфигурация depgraph. Все параметры обязательны.

# Имя анализируемого пакета.
# Обычный режим: имя по правилам npm (express, @types/node).
# Тестовый режим: большие латинские буквы (A, B, ABC).
package_name: express

# Обычный режим: URL-адрес npm-репозитория (http:// или https://).
# Тестовый режим: путь к файлу с описанием тестового репозитория.
repository: https://registry.npmjs.org

# Режим работы с тестовым репозиторием: true или false.
test_mode: false

# Версия пакета в формате MAJOR.MINOR.PATCH. Пишите в кавычках,
# иначе YAML может прочитать значение вроде 1.0 как число.
version: "4.18.2"

# Имя сгенерированного файла с изображением графа (.png).
output_file: graph.png

# Необязательно. Пакет, для которого вывести обратные зависимости (пакеты графа,
# которые от него зависят). Если параметр не задан, выводится граф зависимостей.
# reverse_for: depd
